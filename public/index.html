<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>공항 주차장</title>

<!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다. 아이폰은 manifest 대신
     apple- 접두사 메타를 보므로 양쪽을 다 둔다. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공항주차장">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1e40af">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 자동완성을 끈다. 브라우저나 확장프로그램이 채운 값은 비밀번호 칸이라 보이지
     않아, 남아 있으면 영문 모를 인증 실패로만 나타난다. -->
<form id="login" hidden autocomplete="off">
  <h1>공항 주차장</h1>
  <label for="password">접속 암호</label>
  <input id="password" name="password" type="password"
         autocomplete="new-password" required>
  <p id="reveal-row">
    <input id="reveal" type="checkbox">
    <label for="reveal">입력한 암호 보기</label>
    <span id="pw-count">0자</span>
  </p>
  <button type="submit">확인</button>
  <p id="login-msg" role="status"></p>
</form>

<div id="app" hidden>
  <header>
    <nav id="airports" aria-label="공항 선택"></nav>
    <p id="freshness" role="status"></p>
  </header>
  <main id="lots"></main>
</div>

<script src="app.js"></script>
</body>
</html>
