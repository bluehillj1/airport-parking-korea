<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>공항 주차장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form id="login" hidden autocomplete="on">
  <h1>공항 주차장</h1>
  <label for="password">접속 암호</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>
  <p id="reveal-row">
    <input id="reveal" type="checkbox">
    <label for="reveal">입력한 암호 보기</label>
  </p>
  <button type="submit">확인</button>
  <p id="login-msg" role="status"></p>
</form>

<div id="app" hidden>
  <header>
    <nav id="airports" aria-label="공항 선택"></nav>
    <p id="freshness" role="status"></p>
  </header>
  <main id="lots"></main>
</div>

<script src="app.js"></script>
</body>
</html>
